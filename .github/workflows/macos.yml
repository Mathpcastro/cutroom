name: macOS installers
# Builds the .dmg on native runners (Apple Silicon and Intel) and attaches them to the release in
# Mathpcastro/cutroom-releases, where the installers live (this source repository is private).
# Runs when a v* tag is pushed, or by hand with a release tag. Without a tag it only keeps the
# installers as artifacts. It does not run on pull requests: macOS minutes cost 10x on private repos.
# The publish job needs the RELEASES_TOKEN secret: a fine-grained token with "Contents: read and
# write" on Mathpcastro/cutroom-releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag do release em cutroom-releases que recebe os .dmg (ex.: v0.6.3). Vazio = só gera os artefatos."
        required: false
        default: ""
permissions:
  contents: read
jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build .dmg (ad-hoc signed, not notarized)
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # electron-builder skips signing on PR builds; without the ad-hoc signature Apple Silicon reports the app as damaged.
          CSC_FOR_PULL_REQUEST: "true"
      - name: Check the app bundle signature
        run: codesign --verify --deep --strict release/mac*/CutRoom.app
      - uses: actions/upload-artifact@v4
        with:
          name: cutroom-macos-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: dmg
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      RELEASES_REPO: Mathpcastro/cutroom-releases
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cutroom-macos-*
          merge-multiple: true
          path: dmg
      - name: Attach installers and update SHA256SUMS.txt
        run: |
          gh release download "$TAG" -R "$RELEASES_REPO" -p SHA256SUMS.txt -O SHA256SUMS.txt || touch SHA256SUMS.txt
          grep -v -- "-mac-.*\.dmg$" SHA256SUMS.txt > sums.txt || true
          (cd dmg && sha256sum *.dmg) >> sums.txt
          mv sums.txt SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" -R "$RELEASES_REPO" --clobber dmg/*.dmg SHA256SUMS.txt
