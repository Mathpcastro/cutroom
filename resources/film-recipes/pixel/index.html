<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!--
  Formato "pixel" do CutRoom: o seu funil contado como um jogo de plataforma em pixel art.
  Um canvas de 270x480 desenhado em pixels inteiros e ampliado 4x sem suavização, HUD com fonte
  pixel, scanlines de CRT. Tudo é função do tempo (draw(t)); as viradas ficam nas âncoras CR.at.
-->
<script src="brand.js"></script>
<style>
  @font-face { font-family: "Press Start 2P"; src: url(fonts/PressStart2P.ttf); }
  :root { --accent: #ff5a36; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #film { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: "Press Start 2P"; color: #fff; }
  #px { position: absolute; inset: 0; width: 1080px; height: 1920px; image-rendering: pixelated; }
  .crt { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 4px), radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
  .later { visibility: hidden; opacity: 0; }
  .hud { position: absolute; left: 40px; right: 40px; top: 70px; display: flex; justify-content: space-between; font-size: 30px; line-height: 1.5; text-shadow: 4px 4px 0 #000; }
  .hud b { color: #ffd23f; font-weight: 400; }
  .lives { position: absolute; left: 40px; top: 190px; font-size: 40px; color: #ff4d4d; text-shadow: 4px 4px 0 #000; letter-spacing: 8px; }
  .title { position: absolute; left: 0; width: 1080px; text-align: center; font-size: 76px; line-height: 1.25; text-shadow: 8px 8px 0 #000; }
  .t-fase { top: 520px; }
  .t-fase span, .t-clear span { color: var(--accent); }
  .t-boss { top: 330px; font-size: 64px; color: #ff4d4d; }
  .t-combo { top: 560px; font-size: 120px; color: #ffd23f; }
  .t-clear { top: 470px; font-size: 80px; }
  .cap { position: absolute; left: 60px; right: 60px; top: 1500px; text-align: center; font-size: 46px; line-height: 1.35; text-shadow: 5px 5px 0 #000; }
  .cap em { font-style: normal; color: #ffd23f; }
</style>
</head>
<body>
<div id="film" data-composition-id="film" data-start="0" data-duration="36" data-width="1080" data-height="1920">
  <canvas id="px" width="180" height="320"></canvas>
  <div class="hud later"><div>SEGUIDORES<br><b class="coins">000</b></div><div style="text-align:right">CAIXA<br><b class="cash">60 DIAS</b></div></div>
  <div class="lives later">♥♥♥</div>
  <div class="title t-fase later">FASE 1<br><span>LANÇAR O SAAS</span></div>
  <div class="title t-boss later">CHEFÃO:<br>ALGORITMO</div>
  <div class="title t-combo later">COMBO!</div>
  <div class="title t-clear later">FASE<br>COMPLETA!<br><span>1ª VENDA</span></div>
  <div class="cap later"></div>
  <div class="crt"></div>
  <audio id="voz" data-start="0" data-duration="34" data-track-index="20" data-volume="1" src="assets/voice.wav"></audio>
  <!--MUSICA-->
  <!--SFX-->
  <script src="kit/gsap.min.js"></script>
  <script src="timing.js"></script>
  <script src="kit/cutroom-kit.js"></script>
  <script>
    (function () {
      var p = (window.BRAND && window.BRAND.palette) || {};
      if (p.accent) document.documentElement.style.setProperty("--accent", p.accent);
    })();
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    var D = Math.max(CR.timing.voiceEnd + 2.2, 10), at = CR.at;
    var B = {
      fase: at("fase", 1, 0.05), zero: at("zero", 1, 2.0), moeda: at("moeda", 1, 5.4), pula: at("pula", 1, 6.2), chefao: at("chefão", 1, 9.6),
      ignora: at("ignora", 1, 11.4), vida: at("vida", 1, 12.8), poderes: at("poderes", 1, 14.4), carrossel: at("carrossel", 1, 15.4),
      reels: at("reels", 1, 17.6), combo: at("combo", 1, 20.6), aguenta: at("aguenta", 1, 22.0), visita: at("visita", 1, 23.0),
      clique: at("clique", 1, 24.2), venda: at("venda", 1, 25.4), concluida: at("concluída", 1, 26.6), mapa: at("mapa", 1, 28.2), perfil: at("perfil", 2, 30.6), D: D,
    };
    window.BEATS = B;
    CR.slam(tl, ".t-fase", B.fase);
    CR.exit(tl, ".t-fase", B.zero - 0.1);
    CR.show(tl, ".hud", B.zero);
    CR.show(tl, ".lives", B.zero);
    tl.call(function () { document.querySelector(".lives").textContent = "♥♥♡"; }, null, B.vida);
    tl.fromTo(".lives", { scale: 1.6 }, { scale: 1, duration: 0.3 }, B.vida);
    CR.slam(tl, ".t-boss", B.chefao + 0.2);
    CR.exit(tl, ".t-boss", B.ignora - 0.1);
    CR.stamp(tl, ".t-combo", B.combo, -4);
    CR.exit(tl, ".t-combo", B.aguenta + 0.6);
    CR.slam(tl, ".t-clear", B.concluida);
    tl.to(".t-clear", { y: -200, duration: 0.4, ease: "power2.inOut" }, B.mapa - 0.2);
    CR.profileCTA(tl, B.perfil - 1.2, { y: 1080, ink: "#FFFFFF", until: D });
    // Seguidores: each coin is a post; the counter jumps with every pickup and grows with the combo.
    var coins = { v: 0 };
    tl.to(coins, { v: 6, duration: B.chefao - B.moeda, ease: "steps(6)", onUpdate: function () { document.querySelector(".coins").textContent = String(Math.round(coins.v)).padStart(3, "0"); } }, B.moeda);
    tl.to(coins, { v: 248, duration: B.venda - B.combo, ease: "power2.in", onUpdate: function () { document.querySelector(".coins").textContent = String(Math.round(coins.v)).padStart(3, "0"); } }, B.combo);
    var cash = { v: 60 };
    tl.to(cash, { v: 46, duration: B.combo - B.moeda, ease: "none", onUpdate: function () { document.querySelector(".cash").textContent = Math.round(cash.v) + " DIAS"; } }, B.moeda);
    var CAPS = [
      ["zero", 1, 2.0, "<em>0</em> SEGUIDORES"], ["moeda", 1, 5.4, "POST = <em>MOEDA</em>"], ["ignora", 1, 11.4, "IGNORA POST <em>BONITO</em>"],
      ["carrossel", 1, 15.4, "<em>CARROSSEL</em><br>SEGURA A ATENÇÃO"], ["reels", 1, 17.6, "<em>REELS</em><br>TRAZ GENTE NOVA"],
      ["visita", 1, 23.0, "VISITA NO <em>PERFIL</em>"], ["clique", 1, 24.2, "CLIQUE NO <em>LINK</em>"], ["venda", 1, 25.4, "<em>1ª VENDA</em>"],
    ];
    CAPS.forEach(function (c, i) {
      var t0 = at(c[0], c[1], c[2]), next = i + 1 < CAPS.length ? at(CAPS[i + 1][0], CAPS[i + 1][1], CAPS[i + 1][2]) : t0 + 1.4;
      tl.call(function () { document.querySelector(".cap").innerHTML = c[3]; }, null, t0);
      tl.fromTo(".cap", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.12, ease: "steps(3)" }, t0);
      tl.to(".cap", { autoAlpha: 0, duration: 0.08 }, Math.min(next - 0.05, t0 + 1.8));
    });

    // ---------- the game, drawn in pixels ----------
    var cv = document.getElementById("px"), g = cv.getContext("2d");
    g.imageSmoothingEnabled = false;
    var ACC = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#ff5a36";
    var PAL = { K: "#1a1423", S: "#f2c29b", s: "#c98d6a", C: ACC, c: "#b8321f", W: "#ffffff", B: "#2b6fd6", b: "#1b4596", P: "#3a2a22", Y: "#ffd23f", y: "#d9a21b", G: "#5bc95b", g: "#2f8f3f", R: "#ff4d4d", V: "#7b3fe4", v: "#4f22a8", O: "#ff9f1c" };
    function sprite(rows, x, y, flip, pal) {
      for (var r = 0; r < rows.length; r++) for (var c = 0; c < rows[r].length; c++) {
        var ch = rows[r][flip ? rows[r].length - 1 - c : c];
        if (ch === ".") continue;
        g.fillStyle = (pal && pal[ch]) || PAL[ch]; g.fillRect(Math.round(x + c), Math.round(y + r), 1, 1);
      }
    }
    var HERO_TOP = ["....CCCCC.......", "...CCCCCCCC.....", "...KCCCCCCCCC...", "...KSSSSSK......", "...KSKSSKSK.....", "...KSSSSSSK.....", "....KSssSK......", ".....KKKK.......", "....KBBBBK......", "...KBBWWBBK.....", "..KSKBBBBKSK....", "..KSKBBBBKSK....", "....KbbbbK......", "....KBBBBK......"];
    var LEGS = [["....KP..PK......", "....KP..PK......", "....KK..KK......"], ["...KP....PK.....", "..KP......PK....", "..KK......KK...."], ["....KPPPPK......", ".....KP.PK......", ".....KK.KK......"], ["...KP...KP......", "...KK....KPK....", ".........KK....."]];
    function hero(x, y, frame, flip, pal) { sprite(HERO_TOP.concat(LEGS[frame]), x, y, flip, pal); }
    var GOLD = { C: "#ffd23f", c: "#d9a21b", B: "#ffe680", b: "#ffd23f", P: "#d9a21b" };
    function seeded(n) { var s = n * 9301 + 49297; return function () { s = (s * 16807) % 2147483647; return s / 2147483647; }; }
    function sky(cam, mood) {
      var top = mood > 0 ? "#3b1d5e" : "#5ab0ff", bot = mood > 0 ? "#c2456b" : "#bfe6ff";
      if (mood > 1) { top = "#1d3b8f"; bot = "#ffcf6b"; }
      for (var yy = 0; yy < 320; yy += 4) {
        var k = yy / 320;
        g.fillStyle = k < 0.5 ? top : bot;
        // Ordered dithering between the two bands.
        g.fillRect(0, yy, 180, 4);
        if (k > 0.35 && k < 0.65) { g.fillStyle = k < 0.5 ? bot : top; for (var xx = (yy / 4) % 2 ? 0 : 2; xx < 180; xx += 4) g.fillRect(xx, yy, 2, 2); }
      }
      var r = seeded(3);
      for (var i = 0; i < 6; i++) { var cx = ((i * 70 - cam * 0.15) % 280 + 280) % 280 - 40, cy = 24 + r() * 60; g.fillStyle = "#ffffff"; g.fillRect(cx, cy, 34, 8); g.fillRect(cx + 6, cy - 6, 20, 6); }
      // Far city (slow parallax) and hills.
      r = seeded(5);
      for (var j = 0; j < 30; j++) { var w = 12 + Math.floor(r() * 14), h = 30 + Math.floor(r() * 70), bx = ((j * 20 - cam * 0.35) % 600 + 600) % 600 - 40; g.fillStyle = mood > 0 ? "#2a1640" : "#7aa0d8"; g.fillRect(bx, 230 - h, w, h); g.fillStyle = mood > 0 ? "#ffd27a" : "#cfe2ff"; for (var wy = 236 - h; wy < 222; wy += 8) for (var wx = bx + 3; wx < bx + w - 3; wx += 6) if (r() < 0.4) g.fillRect(wx, wy, 2, 3); }
    }
    function ground(cam) {
      for (var x = -((cam | 0) % 16); x < 180; x += 16) {
        g.fillStyle = "#5bc95b"; g.fillRect(x, 230, 16, 4); g.fillStyle = "#2f8f3f"; g.fillRect(x, 234, 16, 2);
        for (var y = 236; y < 320; y += 8) { g.fillStyle = (Math.floor((x + cam) / 16) + y / 8) % 2 ? "#a05a2c" : "#8a4a22"; g.fillRect(x, y, 16, 8); g.fillStyle = "#6b3517"; g.fillRect(x, y, 16, 1); g.fillRect(x + ((y / 8) % 2 ? 8 : 0), y, 1, 8); }
      }
    }
    function coin(x, y, t) { var w = [6, 4, 2, 4][Math.floor(t * 10) % 4]; g.fillStyle = "#ffd23f"; g.fillRect(x + 3 - w / 2, y, w, 8); g.fillStyle = "#fff6b0"; g.fillRect(x + 3 - w / 2, y + 1, 1, 3); }
    function block(x, y, label, used) { g.fillStyle = used ? "#8a5a2c" : "#ffd23f"; g.fillRect(x, y, 16, 16); g.fillStyle = "#6b3517"; g.fillRect(x, y + 15, 16, 1); g.fillRect(x + 15, y, 1, 16); if (!used) { g.fillStyle = "#6b3517"; g.fillRect(x + 6, y + 4, 4, 2); g.fillRect(x + 9, y + 5, 2, 3); g.fillRect(x + 7, y + 8, 2, 2); g.fillRect(x + 7, y + 11, 2, 2); } }
    function iconCarousel(x, y) { [[6, "#ffffff"], [3, "#ffe0d6"], [0, ACC]].forEach(function (o) { g.fillStyle = "#1a1423"; g.fillRect(x + o[0] - 1, y + o[0] - 1, 12, 14); g.fillStyle = o[1]; g.fillRect(x + o[0], y + o[0], 10, 12); }); }
    function iconReels(x, y) { g.fillStyle = "#1a1423"; g.fillRect(x - 1, y - 1, 16, 16); g.fillStyle = "#ff4fa3"; g.fillRect(x, y, 14, 14); g.fillStyle = "#fff"; for (var i = 0; i < 6; i++) g.fillRect(x + 5, y + 4 + i, 1 + Math.min(i, 5 - i) * 1.4, 1); }
    function boss(x, y, t, hp, hit) {
      var r = 22, cx = x + r, cy = y + r;
      for (var yy = -r; yy <= r; yy++) for (var xx = -r; xx <= r; xx++) if (xx * xx + yy * yy <= r * r) { g.fillStyle = hit ? "#ffffff" : (xx + yy) % 7 === 0 ? "#4f22a8" : "#7b3fe4"; g.fillRect(cx + xx, cy + yy + Math.round(Math.sin(t * 4) * 2), 1, 1); }
      var by = Math.round(Math.sin(t * 4) * 2);
      g.fillStyle = "#fff"; g.fillRect(cx - 9, cy - 9 + by, 18, 14); g.fillStyle = "#1a1423"; g.fillRect(cx - 4 + Math.round(Math.sin(t * 2) * 3), cy - 5 + by, 6, 7);
      g.fillStyle = "#1a1423"; g.fillRect(cx - 12, cy + 9 + by, 24, 5); g.fillStyle = "#fff"; for (var k = 0; k < 6; k++) g.fillRect(cx - 11 + k * 4, cy + 9 + by, 2, 3);
      g.fillStyle = "#1a1423"; g.fillRect(x - 2, y - 14, 48, 6); g.fillStyle = "#ff4d4d"; g.fillRect(x - 1, y - 13, Math.round(46 * hp), 4);
    }
    function sign(x, label, lit) { g.fillStyle = "#6b3517"; g.fillRect(x + 14, 200, 4, 30); g.fillStyle = lit ? "#ffd23f" : "#f4efe6"; g.fillRect(x, 180, 32, 22); g.fillStyle = "#1a1423"; g.fillRect(x, 180, 32, 1); g.fillRect(x, 201, 32, 1); g.font = "6px 'Press Start 2P'"; g.fillText(label, x + 2, 194); }
    function fireworks(t, t0) { var r = seeded(9); for (var i = 0; i < 5; i++) { var cx = 20 + r() * 140, cy = 40 + r() * 90, start = t0 + i * 0.35, k = t - start; if (k < 0 || k > 1.2) continue; for (var a = 0; a < 12; a++) { var ang = (a / 12) * Math.PI * 2, d = k * 34; g.fillStyle = ["#ffd23f", "#ff4fa3", "#5ab0ff", ACC][(i + a) % 4]; g.fillRect(Math.round(cx + Math.cos(ang) * d), Math.round(cy + Math.sin(ang) * d), 2, 2); } } }

    function draw(t) {
      g.setTransform(1, 0, 0, 1, 0, 0);
      // Screen shake on hits.
      var shake = (t > B.vida && t < B.vida + 0.35) || (t > B.aguenta && t < B.aguenta + 0.5) ? Math.round(Math.sin(t * 90) * 3) : 0;
      g.translate(shake, 0);
      var mood = t < B.chefao ? 0 : t < B.combo ? 1 : 2;
      // The hero runs right until the boss; the camera follows.
      var runEnd = B.chefao, heroWorld = 30 + Math.min(t, runEnd) * 34 + (t > B.combo ? (t - B.combo) * 40 : 0);
      if (t > B.visita) heroWorld += (t - B.visita) * 26;
      var cam = Math.max(0, heroWorld - 40);
      sky(cam, mood);
      ground(cam);
      // Coins along the path (each one is a post); collected when the hero passes.
      for (var i = 0; i < 6; i++) { var cxw = 110 + i * 28, cyw = 200 - (i % 2) * 22; if (heroWorld < cxw - 4) coin(cxw - cam, cyw, t); }
      var walking = t < runEnd || (t > B.combo && t < B.concluida);
      var frame = walking ? Math.floor(t * 10) % 4 : 0;
      var jump = 0;
      if (t > B.pula && t < B.chefao) jump = Math.max(0, Math.sin(((t - B.pula) % 0.8) / 0.8 * Math.PI)) * 26;
      var poweredUp = t > B.combo;
      var hx = heroWorld - cam, hy = 213 - jump;
      if (t > B.vida && t < B.vida + 0.6 && Math.floor(t * 20) % 2) {} else hero(hx, hy, jump > 2 ? 3 : frame, false, poweredUp ? GOLD : null);
      // Boss arena.
      if (t > B.chefao - 0.4 && t < B.aguenta + 0.6) {
        var bx = 118 - (t < B.chefao ? (B.chefao - t) * -200 : 0), hit = t > B.combo && Math.floor(t * 12) % 3 === 0;
        var hp = t < B.combo ? 1 : Math.max(0, 1 - (t - B.combo) / Math.max(0.5, B.aguenta - B.combo));
        if (t < B.aguenta) boss(bx, 186, t, hp, hit);
        else { var k = (t - B.aguenta) / 0.6, rr = seeded(4); for (var p = 0; p < 40; p++) { g.fillStyle = p % 2 ? "#7b3fe4" : "#ffd23f"; g.fillRect(bx + 22 + (rr() - 0.5) * 120 * k, 208 + (rr() - 0.5) * 120 * k, 3, 3); } }
        // The boss ignores pretty posts: they bounce off.
        if (t > B.ignora && t < B.vida) { var q = (t - B.ignora) / Math.max(0.3, B.vida - B.ignora); iconCarousel(hx + 18 + q * 70 - (q > 0.6 ? (q - 0.6) * 180 : 0), 196 - Math.sin(q * Math.PI) * 24); }
        // Combo shots.
        if (poweredUp && t < B.aguenta) for (var s2 = 0; s2 < 4; s2++) { var ph = ((t - B.combo) * 2.4 + s2 * 0.25) % 1; g.fillStyle = s2 % 2 ? "#ffd23f" : "#ff4fa3"; g.fillRect(hx + 16 + ph * (bx - hx), 210 + Math.sin(ph * 6) * 4, 5, 3); }
      }
      // Power-up blocks and what comes out of them.
      if (t > B.poderes - 0.3 && t < B.combo + 0.5) {
        block(48, 150, "C", t > B.carrossel); block(84, 150, "R", t > B.reels);
        if (t > B.carrossel) iconCarousel(51, 130 - Math.min(1, (t - B.carrossel) * 4) * 10);
        if (t > B.reels) iconReels(85, 130 - Math.min(1, (t - B.reels) * 4) * 10);
      }
      // The funnel as signposts: perfil → link → venda.
      if (t > B.visita - 0.5) { sign(80 - (t - B.visita) * 14, "PERFIL", t > B.visita); sign(120 - (t - B.visita) * 14, "LINK", t > B.clique); sign(160 - (t - B.visita) * 14, "VENDA", t > B.venda); }
      if (t > B.concluida) fireworks(t, B.concluida);
    }
    var st = { t: 0 };
    tl.to(st, { t: D, duration: D, ease: "none", onUpdate: function () { draw(st.t); } }, 0);
    draw(0);
    tl.set({}, {}, D);
    window.__timelines["film"] = tl;
  </script>
</div>
</body>
</html>
