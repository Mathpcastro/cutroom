<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!--
  Formato "stickman" do CutRoom: suspense em segunda pessoa com um boneco de palito 2D dentro de um
  cenário 3D low-poly com luz de verdade (three.js), HUD de dia e hora, regras em adesivos, celular
  em primeira pessoa e final com escolha. Roteiro de exemplo em roteiro.txt.
  Para adaptar: troque o roteiro, os textos dos adesivos e de CAPS e as âncoras CR.at(...).
-->
<script src="brand.js"></script>
<style>
  @font-face { font-family: Anton; src: url(fonts/Anton-Regular.ttf); }
  @font-face { font-family: "Instrument Sans"; src: url(fonts/InstrumentSans.ttf); font-weight: 100 900; }
  @font-face { font-family: "JetBrains Mono"; src: url(fonts/JetBrainsMono.ttf); font-weight: 100 900; }
  :root { --accent: #ff5a36; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05060a; }
  #film { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #05060a; }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  .later { visibility: hidden; opacity: 0; }
  .hud { position: absolute; left: 60px; top: 110px; font: 700 46px "JetBrains Mono"; color: #fff; letter-spacing: 2px; text-shadow: 0 3px 18px rgba(0,0,0,.6); }
  .hud .dot { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: #ff3b30; margin-right: 14px; vertical-align: 6px; }
  .hud small { display: block; font: 600 26px "JetBrains Mono"; opacity: .7; margin-top: 8px; letter-spacing: 4px; }
  .sticker { position: absolute; left: 90px; top: 300px; padding: 26px 34px 30px; background: #fff; color: #111; border: 8px solid #111; box-shadow: 14px 14px 0 #111; transform-origin: 0 0; }
  .sticker b { display: block; font: 40px/1 Anton; color: var(--accent); letter-spacing: 3px; }
  .sticker span { display: block; font: 92px/0.95 Anton; margin-top: 8px; }
  .cap { position: absolute; left: 0; width: 1080px; top: 1300px; text-align: center; font: 112px/1 Anton; color: #fff; text-shadow: 0 6px 0 #000, 0 10px 40px rgba(0,0,0,.7); }
  .cap em { font-style: normal; color: var(--accent); }
  .big { position: absolute; left: 0; width: 1080px; text-align: center; color: #fff; text-shadow: 0 8px 50px rgba(0,0,0,.8); }
  .runway { top: 560px; font: 280px/1 Anton; color: #ffd166; }
  .runway small { display: block; font: 600 46px "JetBrains Mono"; letter-spacing: 6px; color: #fff; margin-top: 10px; }
  .count { top: 520px; font: 800 300px/1 "JetBrains Mono"; color: #ff3b30; }
  .phone { position: absolute; left: 190px; top: 520px; width: 700px; height: 1300px; border-radius: 90px; background: #0d0f14; border: 14px solid #1d2029; box-shadow: 0 40px 120px rgba(0,0,0,.7); overflow: hidden; }
  .phone .bar { height: 120px; display: flex; align-items: center; justify-content: center; color: #fff; font: 600 34px "Instrument Sans"; opacity: .7; }
  .notif { margin: 40px 34px; padding: 34px 36px; border-radius: 36px; background: rgba(255,255,255,.12); color: #fff; font: 500 40px/1.3 "Instrument Sans"; }
  .notif b { display: block; font: 700 30px "Instrument Sans"; opacity: .7; margin-bottom: 10px; }
  .notif i { font-style: normal; font-weight: 700; font-size: 58px; }
  .thumb { position: absolute; bottom: -60px; width: 120px; height: 260px; border-radius: 60px; background: #f4efe6; border: 12px solid #111; }
  .choice { position: absolute; left: 70px; width: 940px; padding: 46px 40px; border-radius: 34px; color: #fff; font: 96px/1 Anton; text-align: center; border: 8px solid rgba(255,255,255,.9); }
  .c1 { top: 700px; background: #1fa35a; } .c2 { top: 930px; background: #d62f2f; }
  .ask { top: 520px; font: 100px/1 Anton; }
  .comment { top: 1170px; font: 700 54px "Instrument Sans"; letter-spacing: 4px; }
</style>

<div id="film" data-composition-id="film" data-start="0" data-duration="36" data-width="1080" data-height="1920">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div class="hud later"><span class="dot"></span><span class="hud-t">DIA 1 · 09:00</span><small>SEU SAAS · AO VIVO</small></div>

  <div class="big count later">01:59</div>

    <div class="notif later"><b>DIRECT · AGORA</b><i>quanto custa?</i></div>

  <script src="kit/gsap.min.js"></script>

  <script>
    // Timeline and DOM overlay (classic script: registered synchronously).
    (function () {
      var p = (window.BRAND && window.BRAND.palette) || {};
      if (p.accent) document.documentElement.style.setProperty("--accent", p.accent);
    })();
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    var D = Math.max(CR.timing.voiceEnd + 2.2, 10), at = CR.at;
    // Story beats (word anchors with fallbacks): the 3D scene below reads the same numbers.
    var B = (window.BEATS = {
      dia1: at("dia", 1, 1.6), regras: at("regras", 1, 3.6), r1: at("regra", 1, 5.6), r2: at("regra", 2, 7.1), r3: at("regra", 3, 9.5),
      sete: at("sete", 1, 13.0), catorze: at("catorze", 1, 14.6), trinta: at("trinta", 1, 17.4), onze: at("onze", 1, 18.2),
      vibra: at("vibra", 1, 20.4), quanto: at("quanto", 1, 21.6), regra2: at("regra", 4, 23.9), regra3: at("regra", 5, 26.0),
      faltam: at("faltam", 1, 27.0), responde: at("responde", 1, 28.6), comenta: at("comenta", 1, 30.6), modelo: at("modelo", 1, 32.0), D: D,
    });
    function sticker(sel, t, out) {
      tl.fromTo(sel, { autoAlpha: 0, scale: 1.6, rotation: -14 }, { autoAlpha: 1, scale: 1, rotation: -5, duration: 0.22, ease: "power4.out" }, t);
      if (out) tl.to(sel, { autoAlpha: 0, y: -40, duration: 0.18 }, out);
    }
    function hud(t, text) { tl.call(function () { document.querySelector(".hud-t").textContent = text; }, null, t); tl.fromTo(".hud", { x: -8 }, { x: 0, duration: 0.2, ease: "power2.out" }, t); }
    CR.show(tl, ".hud", B.dia1);
    hud(B.dia1, "DIA 1 · 09:00");
    sticker(".s0", B.regras, B.r1 - 0.05);
    sticker(".s1", B.r1, B.r2 - 0.05);
    sticker(".s2", B.r2, B.r3 - 0.05);
    sticker(".s3", B.r3, B.sete - 0.1);
    hud(B.sete, "DIA 7 · 21:14");
    hud(B.catorze, "DIA 14 · 02:40");
    CR.slam(tl, ".runway", B.catorze + 0.5);
    CR.count(tl, ".rn", 60, 46, B.catorze + 0.5, 1.2);
    CR.exit(tl, ".runway", B.trinta - 0.1);
    hud(B.trinta, "DIA 30 · 23:58");
    // The phone in your hands: slides up, vibrates, the DM appears.
    tl.set(".phone", { y: 1500 }, 0);
    tl.to(".phone", { y: 0, duration: 0.5, ease: "power3.out" }, B.vibra - 0.3);
    for (var v = 0; v < 6; v++) tl.to(".phone", { x: v % 2 ? 10 : -10, duration: 0.05 }, B.vibra + v * 0.06);
    tl.to(".phone", { x: 0, duration: 0.05 }, B.vibra + 0.4);
    CR.pop(tl, ".notif", B.quanto - 0.1);
    tl.to(".phone", { y: 1500, duration: 0.45, ease: "power3.in" }, B.regra2 - 0.3);
    // The rules collide: the old stickers flash back.
    tl.fromTo(".s2", { autoAlpha: 0, scale: 1.3, rotation: 6, y: 0 }, { autoAlpha: 1, scale: 1, rotation: 3, duration: 0.2 }, B.regra2);
    tl.to(".s2 b", { color: "#ff3b30", duration: 0.1 }, B.regra2);
    tl.to(".s2", { autoAlpha: 0, duration: 0.15 }, B.regra3 - 0.05);
    tl.fromTo(".s3", { autoAlpha: 0, scale: 1.3, rotation: -8, y: 0 }, { autoAlpha: 1, scale: 1, rotation: -4, duration: 0.2 }, B.regra3);
    tl.to(".s3", { autoAlpha: 0, duration: 0.15 }, B.faltam - 0.05);
    // Countdown: two minutes left.
    CR.slam(tl, ".count", B.faltam);
    var cd = { s: 119 };
    tl.to(cd, { s: 112, duration: Math.max(0.5, B.responde - B.faltam), ease: "none", onUpdate: function () { var s = Math.ceil(cd.s); document.querySelector(".count").textContent = "0" + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); } }, B.faltam);
    CR.exit(tl, ".count", B.responde - 0.1);
    // The choice: both options look bad.
    CR.slam(tl, ".ask", B.responde + 0.05);
    tl.fromTo(".c1", { autoAlpha: 0, x: -200 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "back.out(1.6)" }, B.responde + 0.2);
    tl.fromTo(".c2", { autoAlpha: 0, x: 200 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "back.out(1.6)" }, B.responde + 0.45);
    CR.rise(tl, ".comment", B.comenta);
    tl.to(".ask, .c1, .c2, .comment", { y: -260, duration: 0.5, ease: "power2.inOut" }, B.modelo - 0.2);
    CR.profileCTA(tl, B.modelo, { y: 1180, ink: "#FFFFFF", until: D });
    // Chunky captions: 1-3 words, key word in the accent colour.
    var CAPS = [
      ["imagine", 1, 0.05, "IMAGINE"], ["lançou", 1, 0.9, "VOCÊ <em>LANÇOU</em>"], ["dia", 1, 1.6, "<em>DIA 1</em>"],
      ["sete", 1, 13.0, "<em>ZERO</em> CURTIDAS"], ["dinheiro", 1, 15.4, "SEU <em>DINHEIRO</em>"], ["vibra", 1, 20.4, "O CELULAR <em>VIBRA</em>"],
      ["dois", 3, 27.2, "<em>2 MINUTOS</em>"],
    ];
    CAPS.forEach(function (c, i) {
      var t0 = at(c[0], c[1], c[2]), next = i + 1 < CAPS.length ? at(CAPS[i + 1][0], CAPS[i + 1][1], CAPS[i + 1][2]) : t0 + 1.6;
      tl.call(function () { document.querySelector(".cap").innerHTML = c[3]; }, null, t0);
      tl.fromTo(".cap", { autoAlpha: 0, scale: 1.25 }, { autoAlpha: 1, scale: 1, duration: 0.14, ease: "power3.out" }, t0);
      tl.to(".cap", { autoAlpha: 0, duration: 0.1 }, Math.min(next - 0.05, t0 + 1.4));
    });
    tl.set({}, {}, D);
    // Motion kit: every rule and every threat lands with a hit.
    var FX = CRM.overlay(tl, D, [
      { t: B.vibra, x: 540, y: 1100, kind: "spark", n: 30, spread: 600, seed: 3 },
      { t: B.responde, x: 540, y: 900, kind: "spark", n: 50, spread: 900, colors: ["#3ddc84", "#ff4d4d", "#ffffff"], seed: 5 },
    ]);
    [B.r1, B.r2, B.r3].forEach(function (t) { CRM.shake(tl, "#film", t + 0.05, 12, 0.25); });
    CRM.shake(tl, "#film", B.vibra, 18, 0.5);
    CRM.flash(tl, FX.flash, B.quanto, 0.45);
    CRM.shake(tl, "#film", B.faltam, 14, 0.3);
    CRM.flash(tl, FX.flash, B.responde, 0.35);
    window.__timelines["film"] = tl;
  </script>
  <script type="module">
    // The 3D set: low-poly apartment, real lights and shadows, a 2D stickman billboard.
    import * as THREE from "three";
    import { EffectComposer } from "./kit/three/postprocessing/EffectComposer.js";
    import { RenderPass } from "./kit/three/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "./kit/three/postprocessing/UnrealBloomPass.js";
    import { ShaderPass } from "./kit/three/postprocessing/ShaderPass.js";
    import { OutputPass } from "./kit/three/postprocessing/OutputPass.js";
    const B = window.BEATS, tl = window.__timelines["film"];
    const ACCENT = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#ff5a36";

    renderer.setPixelRatio(1);
    renderer.setSize(1080, 1920, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog("#0a0d18", 9, 22);
    const cam = new THREE.PerspectiveCamera(55, 1080 / 1920, 0.05, 60);

    const box = (w, h, d, c, x, y, z, ry) => add(new THREE.BoxGeometry(w, h, d), std(c), x, y, z, ry);
    // Room: floor, walls (the left wall has a real hole for the window), ceiling.
    box(9, 0.2, 9, "#7a5638", 0, -0.1, 0);
    box(9, 6, 0.2, "#c8b49b", 0, 3, -4.5);
    box(0.2, 6, 2.6, "#bba890", -4.5, 3, -3.2); box(0.2, 6, 3.2, "#bba890", -4.5, 3, 2.9);
    box(0.2, 1.4, 3.2, "#bba890", -4.5, 0.7, -0.3); box(0.2, 1.6, 3.2, "#bba890", -4.5, 5.2, -0.3);
    box(0.2, 6, 9, "#b39f86", 4.5, 3, 0);
    box(9, 0.2, 9, "#8e7f6e", 0, 6, 0);
    // Window frame + the city behind it (a canvas texture, day → night).
    const city = document.createElement("canvas"); city.width = 512; city.height = 512;
    const cityTex = new THREE.CanvasTexture(city); cityTex.colorSpace = THREE.SRGBColorSpace;
    const cityMesh = add(new THREE.PlaneGeometry(9, 6), new THREE.MeshBasicMaterial({ map: cityTex, fog: false }), -7.5, 3, -0.3, Math.PI / 2);
    cityMesh.castShadow = false;
    [[-4.45, 1.45, -0.3, 0.12, 0.12, 3.3], [-4.45, 4.35, -0.3, 0.12, 0.12, 3.3], [-4.45, 2.9, -1.9, 0.12, 3, 0.12], [-4.45, 2.9, 1.3, 0.12, 3, 0.12], [-4.45, 2.9, -0.3, 0.08, 3, 0.08]].forEach(([x, y, z, w, h, d]) => box(w, h, d, "#1f1b28", x, y, z));
    // Desk, chair, laptop, bed, shelf, door.
    box(2.6, 0.12, 1.3, "#7a5a44", 0.4, 1.05, -3.6); [[-0.8, -4.1], [1.6, -4.1], [-0.8, -3.1], [1.6, -3.1]].forEach(([x, z]) => box(0.1, 1.0, 0.1, "#4a3428", x, 0.5, z));
    box(0.9, 0.1, 0.9, "#2b2f3d", 0.3, 0.62, -2.5); box(0.9, 0.9, 0.1, "#2b2f3d", 0.3, 1.1, -2.05);
    box(1.0, 0.04, 0.7, "#c9ccd6", 0.3, 1.13, -3.7);
    const screenCv = document.createElement("canvas"); screenCv.width = 512; screenCv.height = 320;
    const screenTex = new THREE.CanvasTexture(screenCv); screenTex.colorSpace = THREE.SRGBColorSpace;
    const screen = add(new THREE.PlaneGeometry(1.0, 0.62), new THREE.MeshBasicMaterial({ map: screenTex, color: "#cfcfcf" }), 0.3, 1.47, -4.02);
    screen.rotation.x = -0.12; screen.castShadow = false;
    box(1.04, 0.66, 0.03, "#2a2d36", 0.3, 1.47, -4.05);
    box(2.2, 0.5, 3.6, "#6f88b8", 3.2, 0.25, 1.6); box(2.2, 0.25, 1.0, "#e9e3d8", 3.2, 0.62, 0.15);
    box(1.6, 0.08, 0.5, "#6b4b3a", -2.6, 2.6, -4.2); box(0.3, 0.5, 0.3, ACCENT, -3.1, 2.9, -4.2); box(0.4, 0.35, 0.3, "#e9e3d8", -2.5, 2.82, -4.2);
    box(0.12, 4.2, 1.8, "#5b4636", 4.42, 2.1, -2.6);
    const gap = add(new THREE.BoxGeometry(0.05, 0.06, 1.7), new THREE.MeshBasicMaterial({ color: "#ffb35c", toneMapped: false }), 4.36, 0.03, -2.6);
    // Wall clock and calendar (canvas textures).
    const clockCv = document.createElement("canvas"); clockCv.width = clockCv.height = 256;
    const clockTex = new THREE.CanvasTexture(clockCv); clockTex.colorSpace = THREE.SRGBColorSpace;
    const clock = add(new THREE.CircleGeometry(0.45, 40), std("#ffffff", { map: clockTex, roughness: 0.6 }), 1.9, 3.6, -4.38); clock.castShadow = false;
    const calCv = document.createElement("canvas"); calCv.width = 256; calCv.height = 320;
    const calTex = new THREE.CanvasTexture(calCv); calTex.colorSpace = THREE.SRGBColorSpace;
    const cal = add(new THREE.PlaneGeometry(0.8, 1.0), std("#ffffff", { map: calTex, roughness: 0.7 }), -1.4, 3.4, -4.38); cal.castShadow = false;

    const stickTex = new THREE.CanvasTexture(stickCv); stickTex.colorSpace = THREE.SRGBColorSpace;
    const stick = add(new THREE.PlaneGeometry(1.875, 2.8125), new THREE.MeshStandardMaterial({ map: stickTex, alphaTest: 0.5, side: THREE.DoubleSide, emissive: "#ffffff", emissiveMap: stickTex, emissiveIntensity: 0.18 }), 0.3, 1.2, -2.3);
    stick.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: stickTex, alphaTest: 0.5 });

    const amb = new THREE.HemisphereLight("#fff1dc", "#5a4636", 1.6); scene.add(amb);
    const sun = new THREE.DirectionalLight("#ffd9a8", 4.0); sun.position.set(-9, 6, 0.5); sun.target.position.set(0.5, 0, -2); scene.add(sun, sun.target);
    sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });

    const glow = new THREE.PointLight("#8fd0ff", 0, 6); glow.position.set(0.3, 1.6, -3.4); glow.castShadow = true; scene.add(glow);
    const door = new THREE.SpotLight("#ffa04d", 0, 9, 0.5, 0.6); door.position.set(4.3, 0.1, -2.6); door.target.position.set(1, 0, -2.3); scene.add(door, door.target);

    composer.addPass(new UnrealBloomPass(new THREE.Vector2(540, 960), 0.45, 0.45, 0.9));
    const lens = new ShaderPass({
      uniforms: { tDiffuse: { value: null }, seed: { value: 0 }, vig: { value: 0.55 } },
      vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
      fragmentShader: "uniform sampler2D tDiffuse; uniform float seed; uniform float vig; varying vec2 vUv; float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + seed) * 43758.5453); } void main(){ vec2 c = vUv - 0.5; float d = dot(c, c); vec2 off = c * 0.004; vec3 col = vec3(texture2D(tDiffuse, vUv + off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - off).b); col *= 1.0 - vig * smoothstep(0.08, 0.55, d); col += (h(vUv * 1000.0) - 0.5) * 0.07; gl_FragColor = vec4(col, 1.0); }",
    });

    composer.addPass(new OutputPass());

    // ---- drawings ----
    const ink = "#121018", body = "#f4efe6";
    function drawStick(pose, t) {
      const g = stickCv.getContext("2d");
      g.clearRect(0, 0, 512, 768);
      g.lineCap = g.lineJoin = "round";
      const P = (x, y) => [256 + x, 560 - y];
      const seg = (a, b) => { g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); };
      const limb = (o, l1, a1, l2, a2) => { const k = [o[0] + Math.sin(a1) * l1, o[1] + Math.cos(a1) * l1], e = [k[0] + Math.sin(a1 + a2) * l2, k[1] + Math.cos(a1 + a2) * l2]; return [o, k, e]; };
      const hip = P(0, pose.sit ? 40 : 150), neck = P(pose.lean || 0, pose.sit ? 250 : 360);
      const head = [neck[0] + (pose.headX || 0), neck[1] - 70];
      const legs = pose.sit ? [limb(hip, 130, 1.45, 130, -1.45), limb(hip, 130, 1.35, 130, -1.35)] : [limb(hip, 140, 0.18, 140, -0.05), limb(hip, 140, -0.18, 140, 0.05)];
      const arms = [limb(neck, 105, pose.aL1 ?? 0.5, 100, pose.aL2 ?? 0.4), limb(neck, 105, pose.aR1 ?? -0.5, 100, pose.aR2 ?? -0.4)];
      for (const pass of [[ink, 34], [body, 18]]) {
        g.strokeStyle = pass[0]; g.lineWidth = pass[1];
        seg(hip, neck);
        [...legs, ...arms].forEach(([a, b, c]) => { seg(a, b); seg(b, c); });
      }
      g.fillStyle = body; g.strokeStyle = ink; g.lineWidth = 14;
      g.beginPath(); g.arc(head[0], head[1], 62, 0, Math.PI * 2); g.fill(); g.stroke();
      // The mark: a cap in the brand colour, so the main character always reads.
      g.fillStyle = ACCENT; g.beginPath(); g.arc(head[0], head[1] - 8, 64, Math.PI, 0); g.fill(); g.stroke();
      g.beginPath(); g.ellipse(head[0] + 58, head[1] - 34, 44, 11, -0.15, 0, Math.PI * 2); g.fill(); g.stroke();
      const blink = (Math.floor(t * 10) % 37) === 0;
      g.fillStyle = ink;
      [-22, 22].forEach((dx) => { g.beginPath(); if (blink) g.fillRect(head[0] + dx - 9, head[1] + 12, 18, 4); else { g.arc(head[0] + dx + (pose.lookX || 0), head[1] + 14, 9, 0, Math.PI * 2); g.fill(); } });
      if (pose.phone) { const hand = arms[1][2]; g.fillStyle = "#1d2029"; g.fillRect(hand[0] - 26, hand[1] - 70, 52, 90); g.fillStyle = "#8fd0ff"; g.fillRect(hand[0] - 18, hand[1] - 62, 36, 70); }
      stickTex.needsUpdate = true;
    }
    function wrap(g, text, x, y, w, lh) { const words = text.split(" "); let line = ""; for (const wd of words) { if (g.measureText(line + wd).width > w) { g.fillText(line, x, y); y += lh; line = ""; } line += wd + " "; } g.fillText(line, x, y); }
    function drawScreen(t) {
      const g = screenCv.getContext("2d");
      g.fillStyle = "#f6f5f2"; g.fillRect(0, 0, 512, 320);
      g.fillStyle = "#111"; g.font = "700 26px Instrument Sans"; g.fillText("@seusaas", 24, 40);
      const card = t < B.r2 ? "5 DICAS PRA VENDER" : t < B.r3 ? "R$ 97/MÊS" : "COMO VENDER SEM ANÚNCIO";
      g.fillStyle = ACCENT; g.fillRect(24, 60, 300, 230);
      g.fillStyle = "#fff"; g.font = "44px Anton"; wrap(g, card, 44, 120, 260, 48);
      if (t >= B.r2 && t < B.r3) { g.strokeStyle = "#ff1f1f"; g.lineWidth = 12; g.beginPath(); g.moveTo(40, 80); g.lineTo(310, 270); g.stroke(); }
      const likes = t < B.sete ? Math.min(3, Math.floor((t - B.r1) * 2)) : 0;
      g.fillStyle = "#111"; g.font = "700 30px Instrument Sans"; g.fillText("♥ " + Math.max(0, likes), 350, 120);
      g.fillStyle = "#666"; g.font = "500 22px Instrument Sans"; g.fillText(t < B.sete ? "publicado" : "0 curtidas", 350, 160);
      if (t >= B.catorze) { g.fillStyle = "#ffe8e0"; g.fillRect(340, 200, 150, 80); g.fillStyle = "#c22"; g.font = "700 22px JetBrains Mono"; g.fillText("caixa: 46d", 352, 248); }
      screenTex.needsUpdate = true;
    }
    function drawClock(hours) {
      const g = clockCv.getContext("2d"); g.fillStyle = "#fbfaf6"; g.fillRect(0, 0, 256, 256);
      g.strokeStyle = "#111"; g.lineWidth = 10; g.beginPath(); g.arc(128, 128, 118, 0, Math.PI * 2); g.stroke();
      const hand = (a, l, w) => { g.lineWidth = w; g.lineCap = "round"; g.beginPath(); g.moveTo(128, 128); g.lineTo(128 + Math.sin(a) * l, 128 - Math.cos(a) * l); g.stroke(); };
      hand(((hours % 12) / 12) * Math.PI * 2, 60, 12); hand((((hours * 60) % 60) / 60) * Math.PI * 2, 92, 7);
      clockTex.needsUpdate = true;
    }
    function drawCal(day) {
      const g = calCv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, 256, 320);
      g.fillStyle = ACCENT; g.fillRect(0, 0, 256, 70); g.fillStyle = "#fff"; g.font = "40px Anton"; g.textAlign = "center"; g.fillText("NOV", 128, 52);
      g.fillStyle = "#111"; g.font = "170px Anton"; g.fillText(String(day), 128, 260); g.textAlign = "left";
      calTex.needsUpdate = true;
    }
    let lastNight = -1;
    function drawCity(night) {
      const q = Math.round(night * 20) / 20;
      if (q === lastNight) return;
      lastNight = q;
      const g = city.getContext("2d");
      const sky = g.createLinearGradient(0, 0, 0, 512);
      sky.addColorStop(0, `rgb(${Math.round(120 - 110 * q)},${Math.round(180 - 165 * q)},${Math.round(235 - 190 * q)})`);
      sky.addColorStop(1, `rgb(${Math.round(250 - 215 * q)},${Math.round(210 - 180 * q)},${Math.round(170 - 110 * q)})`);
      g.fillStyle = sky; g.fillRect(0, 0, 512, 512);
      let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
      for (let i = 0; i < 16; i++) { const w = 28 + r() * 40, h = 120 + r() * 260, x = i * 33 - 10; g.fillStyle = q > 0.5 ? "#0c0f1c" : "#5a6a8a"; g.fillRect(x, 512 - h, w, h); for (let y = 512 - h + 14; y < 500; y += 22) for (let xx = x + 6; xx < x + w - 8; xx += 14) if (r() < 0.12 + q * 0.4) { g.fillStyle = q > 0.5 ? "#ffd27a" : "#9fb0cc"; g.fillRect(xx, y, 6, 9); } }
      cityTex.needsUpdate = true;
    }

    // ---- camera shots: cut on the beats, and every shot drifts ----
    const V = (x, y, z) => new THREE.Vector3(x, y, z);
    const SHOTS = [
      [0, V(2.2, 1.75, -2.5), V(0.3, 1.45, -2.3), 36, V(3.0, 2.6, 1.4), V(0.2, 1.3, -2.6), 50],
      [B.regras, V(-2.0, 1.9, 0.4), V(0.3, 1.4, -2.6), 46, V(-1.6, 2.0, -0.1), V(0.3, 1.4, -2.8), 42],
      [B.r1, V(1.4, 1.75, -2.3), V(0.3, 1.45, -4.0), 38, V(1.2, 1.7, -2.6), V(0.3, 1.47, -4.0), 34],
      [B.r2, V(0.3, 1.5, -3.15), V(0.3, 1.47, -4.02), 40, V(0.3, 1.5, -3.3), V(0.3, 1.47, -4.02), 36],
      [B.r3, V(1.2, 3.4, -3.0), V(1.9, 3.6, -4.38), 34, V(1.4, 3.5, -3.2), V(1.9, 3.6, -4.38), 30],
      [B.sete, V(-1.2, 3.3, -3.1), V(-1.4, 3.4, -4.38), 34, V(2.6, 2.4, 1.6), V(0.3, 1.3, -2.4), 46],
      [B.catorze, V(2.4, 0.7, 0.6), V(0.3, 1.5, -2.4), 46, V(2.1, 0.8, 0.2), V(0.3, 1.5, -2.4), 42],
      [B.trinta, V(2.6, 0.35, 0.4), V(4.3, 0.2, -2.6), 50, V(2.2, 0.4, -0.2), V(4.3, 0.3, -2.6), 44],
      [B.vibra, V(1.1, 1.95, -1.1), V(0.3, 1.55, -2.3), 40, V(1.0, 1.9, -1.3), V(0.3, 1.6, -2.3), 36],
      [B.faltam, V(0.55, 1.85, -1.3), V(0.3, 1.72, -2.3), 34, V(0.45, 1.8, -1.55), V(0.3, 1.72, -2.3), 24],
      [B.responde, V(2.8, 3.2, 3.0), V(0.2, 1.2, -2.6), 52, V(3.0, 3.6, 3.6), V(0.2, 1.2, -2.6), 56],
    ];
    const ease = (x) => x * x * (3 - 2 * x);
    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
    function shotAt(t) {
      let i = 0;
      for (let k = 0; k < SHOTS.length; k++) if (t >= SHOTS[k][0]) i = k;
      const s = SHOTS[i], end = i + 1 < SHOTS.length ? SHOTS[i + 1][0] : B.D;
      const u = ease(clamp((t - s[0]) / Math.max(0.5, end - s[0]), 0, 1));
      return { pos: s[1].clone().lerp(s[4], u), look: s[2].clone().lerp(s[5], u), fov: s[3] + (s[6] - s[3]) * u };
    }
    function poseAt(t) {
      if (t >= B.faltam) return { sit: true, aL1: 2.6, aL2: 0.6, aR1: -2.6, aR2: -0.6, lean: -10, lookX: Math.sin(t * 3) * 5 };
      if (t >= B.vibra) return { sit: true, phone: true, aR1: -2.4, aR2: -0.9, aL1: 0.6, aL2: 0.6 };
      if (t >= B.sete) return { sit: true, lean: 26, headX: 18, aL1: 0.25, aL2: 0.1, aR1: -0.25, aR2: -0.1 };
      const typing = Math.sin(t * 18) * 0.12;
      return { sit: true, aL1: 1.2 + typing, aL2: 0.5, aR1: -1.2 - typing, aR2: -0.5 };
    }
    function draw(t) {
      const night = clamp((t - B.sete) / Math.max(1, B.trinta - B.sete), 0, 1);
      sun.intensity = 4.0 * (1 - night); amb.intensity = 1.6 - 1.35 * night; amb.color.set(night > 0.5 ? "#7c8cff" : "#fff1dc");
      moon.intensity = 0.9 * night; glow.intensity = 2 + 10 * night; door.intensity = t > B.trinta ? 26 + Math.sin(t * 7) * 3 : 0;
      gap.material.color.set(t > B.trinta ? "#ffb35c" : "#3a2c22");
      scene.fog.color.set(night > 0.5 ? "#05060c" : "#1a1a2a");
      lens.uniforms.vig.value = 0.3 + 0.4 * night;
      lens.uniforms.seed.value = Math.floor(t * 24) * 1.37;
      drawCity(night);
      drawScreen(t);
      const hours = t < B.sete ? 9 + t * 0.06 : t < B.catorze ? 21.2 : t < B.trinta ? 2.66 : 23.966 + Math.max(0, t - B.faltam) * 0.003;
      drawClock(hours);
      drawCal(t < B.sete ? 1 : t < B.catorze ? 7 : t < B.trinta ? 14 : 30);
      drawStick(poseAt(t), t);
      const s = shotAt(t);
      // Hand-held micro shake, stronger when the phone vibrates.
      const shake = t > B.vibra && t < B.vibra + 0.5 ? 0.03 : 0.006;
      cam.position.copy(s.pos).add(V(Math.sin(t * 13.1) * shake, Math.cos(t * 11.7) * shake, 0));
      cam.fov = s.fov; cam.updateProjectionMatrix(); cam.lookAt(s.look);
      stick.lookAt(cam.position.x, stick.position.y, cam.position.z);
      composer.render();
    }
    const st = { t: 0 };
    tl.to(st, { t: B.D, duration: B.D, ease: "none", onUpdate: () => draw(st.t) }, 0);
    draw(0);
  </script>
</div>
