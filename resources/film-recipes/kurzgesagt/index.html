<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Formato "kurzgesagt" do CutRoom: explainer ilustrado, vetor chapado em fundo escuro, mascote e profundidade. Roteiro em roteiro.txt. -->
<script src="brand.js"></script>
<style>
  @font-face { font-family: Anton; src: url(fonts/Anton-Regular.ttf); }
  @font-face { font-family: "Instrument Sans"; src: url(fonts/InstrumentSans.ttf); font-weight: 100 900; }
  @font-face { font-family: Montserrat; src: url(fonts/Montserrat-ExtraBold.ttf); font-weight: 800; }
  :root { --accent: #FF7A45; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b1026; }
  #film { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(circle at 50% 38%, #26346a 0%, #121a3d 55%, #0b1026 100%); color: #fff; font-family: "Instrument Sans"; }
  .stars, .stars2 { position: absolute; inset: -120px; }
  .cam, .punch { position: absolute; inset: 0; transform-origin: 50% 45%; }
  .later { visibility: hidden; opacity: 0; }
  .t { position: absolute; left: 70px; width: 940px; text-align: center; font: 800 88px/1.05 Montserrat; letter-spacing: -1px; text-shadow: 0 8px 30px rgba(0,0,0,.35); }
  .t span { color: var(--accent); }
  .planet { position: absolute; left: 290px; top: 640px; width: 500px; height: 800px; }
  .ring { position: absolute; left: 340px; top: 620px; width: 400px; height: 400px; }
  .cards { position: absolute; left: 0; top: 760px; width: 2200px; height: 420px; }
  .kcard { position: absolute; top: 0; width: 330px; height: 420px; border-radius: 40px; border: 12px solid #0d1433; }
  .gap { position: absolute; left: 95px; top: 120px; width: 140px; height: 140px; }
  .eye { position: absolute; left: 290px; top: 640px; width: 500px; height: 500px; }
  .bars { position: absolute; left: 300px; top: 1210px; width: 480px; height: 200px; display: flex; align-items: flex-end; gap: 22px; }
  .bars i { flex: 1; border-radius: 16px 16px 6px 6px; background: var(--accent); border: 8px solid #0d1433; height: 30px; }
  .orb { position: absolute; width: 270px; height: 270px; border-radius: 50%; border: 14px solid #0d1433; display: flex; align-items: center; justify-content: center; font: 800 46px Montserrat; color: #0d1433; }
  .o1 { left: 60px; top: 820px; background: #ff8fa3; } .o2 { left: 405px; top: 820px; background: #7fd3ff; } .o3 { left: 750px; top: 820px; background: #ffd35c; }
  .chain { position: absolute; top: 820px; width: 240px; height: 240px; border-radius: 50%; border: 14px solid #0d1433; display: flex; align-items: center; justify-content: center; font: 800 130px/1 Montserrat; color: #0d1433; }
  .c1 { left: 70px; background: #ffd35c; } .c2 { left: 420px; background: #7fd3ff; } .c3 { left: 770px; background: var(--accent); }
  .arrow { position: absolute; top: 915px; width: 90px; height: 50px; }
  .a1 { left: 315px; } .a2 { left: 665px; }
  .mascot { position: absolute; left: 70px; top: 1330px; width: 250px; height: 300px; }
  .lid { transform-box: fill-box; transform-origin: center; }
</style>
</head>
<body>
<div id="film" data-composition-id="film" data-start="0" data-duration="28" data-width="1080" data-height="1920">
  <svg class="stars" viewBox="0 0 1320 2160"><g class="sg" fill="#fff"></g></svg>
  <div class="cam"><div class="punch">
    <svg class="stars2" viewBox="0 0 1320 2160"><g class="sg2" fill="#bfe8ff"></g></svg>
    <!-- 1. O celular-planeta -->
    <svg class="planet later" viewBox="0 0 500 800">
      <defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fd3ff"/><stop offset="1" stop-color="#3b6fd8"/></linearGradient></defs>
      <rect x="20" y="20" width="460" height="760" rx="80" fill="url(#pg)" stroke="#0d1433" stroke-width="18"/>
      <rect x="70" y="120" width="360" height="430" rx="30" fill="#fff" opacity=".92"/>
      <rect x="110" y="170" width="280" height="40" rx="20" fill="#0d1433" opacity=".8"/><rect x="110" y="240" width="200" height="40" rx="20" fill="#0d1433" opacity=".5"/>
      <circle cx="160" cy="650" r="16" fill="#fff"/><circle cx="210" cy="650" r="16" fill="#fff" opacity=".5"/><circle cx="260" cy="650" r="16" fill="#fff" opacity=".5"/><circle cx="310" cy="650" r="16" fill="#fff" opacity=".5"/>
    </svg>
    <!-- 2. A lacuna que o cérebro quer fechar -->
    <svg class="ring later" viewBox="0 0 400 400"><circle class="gapring" cx="200" cy="200" r="150" fill="none" stroke="#ff8fa3" stroke-width="44" stroke-linecap="round" stroke-dasharray="942" stroke-dashoffset="236" transform="rotate(-90 200 200)"/><text x="200" y="240" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="130" fill="#fff">?</text></svg>
    <div class="cards later"></div>
    <!-- 3. O olho do algoritmo -->
    <svg class="eye later" viewBox="0 0 500 500">
      <circle cx="250" cy="250" r="230" fill="#ffd35c" stroke="#0d1433" stroke-width="18"/>
      <ellipse class="iris" cx="250" cy="250" rx="110" ry="110" fill="#0d1433"/>
      <circle cx="290" cy="205" r="34" fill="#fff"/>
    </svg>
    <div class="bars later"><i></i><i></i><i></i><i></i><i></i></div>
    <!-- 4. Dor, prova, convite -->
    <div class="orb o1 later">DOR</div><div class="orb o2 later">PROVA</div><div class="orb o3 later">CONVITE</div>
    <!-- 5. Curiosidade → atenção → clique -->
    <div class="chain c1 later">?</div>
    <svg class="arrow a1 later" viewBox="0 0 90 50"><path d="M5 25 H70 M50 6 L80 25 L50 44" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="chain c2 later">◉</div>
    <svg class="arrow a2 later" viewBox="0 0 90 50"><path d="M5 25 H70 M50 6 L80 25 L50 44" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="chain c3 later">➜</div>
  </div></div>
  <div class="t t0 later" style="top:300px">POR QUE O CARROSSEL <span>PRENDE?</span></div>
  <div class="t t1 later" style="top:330px">UMA PERGUNTA QUE O CÉREBRO QUER <span>FECHAR</span></div>
  <div class="t t2 later" style="top:330px">CADA CARD ABRE UMA <span>LACUNA</span></div>
  <div class="t t3 later" style="top:330px">MAIS TEMPO, <span>MAIS ALCANCE</span></div>
  <div class="t t4 later" style="top:330px">AGORA, O SEU <span>PRODUTO</span></div>
  <div class="t t5 later" style="top:330px">CURIOSIDADE VIRA <span>CLIQUE</span></div>
  <div class="t t6 later" style="top:760px;font-size:104px">FAÇA A CURIOSIDADE <span>TRABALHAR</span> PRA VOCÊ</div>
  <svg class="mascot later" viewBox="0 0 250 300">
    <g class="m-body"><ellipse cx="125" cy="190" rx="100" ry="105" fill="#f4f4f8" stroke="#0d1433" stroke-width="14"/>
      <ellipse cx="92" cy="165" rx="18" ry="24" fill="#0d1433"/><ellipse cx="158" cy="165" rx="18" ry="24" fill="#0d1433"/>
      <rect class="lid" x="66" y="138" width="120" height="0" fill="#f4f4f8"/>
      <path d="M100 222 Q125 242 150 222" fill="none" stroke="#0d1433" stroke-width="10" stroke-linecap="round"/></g>
    <g class="m-arm"><path d="M215 170 Q245 120 235 80" fill="none" stroke="#0d1433" stroke-width="14" stroke-linecap="round"/></g>
  </svg>
  <audio id="voz" data-start="0" data-duration="26" data-track-index="20" data-volume="1" src="assets/voice.wav"></audio>
  <!--MUSICA-->
  <script src="kit/gsap.min.js"></script>
  <script src="timing.js"></script>
  <script src="kit/cutroom-kit.js"></script>
  <script>
    (function () {
      var p = (window.BRAND && window.BRAND.palette) || {};
      if (p.accent) document.documentElement.style.setProperty("--accent", p.accent);
    })();
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    var D = Math.max(CR.timing.voiceEnd + 1.8, 8), at = CR.at;
    var seed = 3, rnd = function () { return (seed = (seed * 16807) % 2147483647) / 2147483647; };
    var NS = "http://www.w3.org/2000/svg";
    [[".sg", 70, 4], [".sg2", 40, 6]].forEach(function (layer) {
      var g = document.querySelector(layer[0]);
      for (var i = 0; i < layer[1]; i++) {
        var c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", rnd() * 1320); c.setAttribute("cy", rnd() * 2160); c.setAttribute("r", 1.5 + rnd() * layer[2]);
        c.setAttribute("opacity", 0.35 + rnd() * 0.65); g.appendChild(c);
      }
    });
    var cards = document.querySelector(".cards"), cardColors = ["#ff8fa3", "#7fd3ff", "#ffd35c", "#9be59b", "#c3a6ff", "#ff8fa3"];
    cardColors.forEach(function (c, i) {
      var el = document.createElement("div");
      el.className = "kcard";
      el.style.cssText = "left:" + (80 + i * 370) + "px;background:" + c;
      el.innerHTML = '<svg class="gap" viewBox="0 0 140 140"><circle cx="70" cy="70" r="52" fill="none" stroke="#0d1433" stroke-width="22" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="90" transform="rotate(-90 70 70)"/></svg>';
      cards.appendChild(el);
    });
    function title(sel, t, next) { CR.slam(tl, sel, t); if (next) CR.exit(tl, sel, next - 0.15); }
    function out(sel, t) { tl.to(sel, { scale: 0.6, autoAlpha: 0, duration: 0.35, ease: "power2.in" }, t - 0.35); }

    // Paralaxe constante: estrelas de fundo lentas, da frente mais rápidas.
    tl.to(".stars", { y: -60, duration: D, ease: "none" }, 0);
    tl.to(".stars2", { y: -180, duration: D, ease: "none" }, 0);
    // 1. Gancho: zoom de longe até o celular-planeta.
    var tPor = at("por", 1, 0.05), tTudo = at("tudo", 1, 2.4);
    tl.set(".planet", { autoAlpha: 1 }, tPor);
    tl.fromTo(".planet", { scale: 0.08, rotation: -25 }, { scale: 1, rotation: 0, duration: 1.4, ease: "power3.out" }, tPor);
    title(".t0", tPor + 0.2, tTudo);
    // 2. A pergunta aberta: um anel com lacuna que se fecha.
    var tCerebro = at("cérebro", 1, 3.4), tFechar = at("fechar", 1, 4.2);
    out(".planet", tTudo + 0.3);
    title(".t1", tTudo, at("cada", 1, 5.0));
    CR.pop(tl, ".ring", tCerebro - 0.3);
    tl.to(".gapring", { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, tFechar);
    // 3. Cada card abre uma lacuna, o dedo arrasta e ela fecha.
    var tCada = at("cada", 1, 5.0), tDedo = at("dedo", 1, 6.4);
    out(".ring", tCada);
    title(".t2", tCada, at("quanto", 1, 8.0));
    tl.set(".cards", { autoAlpha: 1 }, tCada);
    tl.fromTo(".kcard", { y: 300, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, stagger: 0.08, ease: "back.out(1.6)" }, tCada);
    tl.to(".cards", { x: -1110, duration: 1.6, ease: "power2.inOut" }, tDedo);
    tl.to(".kcard .gap circle", { strokeDashoffset: 0, duration: 0.3, stagger: 0.25 }, tDedo + 0.2);
    // 4. Mais tempo = o algoritmo mostra mais.
    var tQuanto = at("quanto", 1, 8.0), tMostrar = at("mostrar", 1, 10.6);
    out(".cards", tQuanto);
    title(".t3", tQuanto, at("agora", 1, 11.4));
    CR.pop(tl, ".eye", tQuanto + 0.1);
    tl.to(".iris", { attr: { rx: 70, ry: 70 }, duration: 0.5, yoyo: true, repeat: 1 }, tQuanto + 0.9);
    CR.show(tl, ".bars", tQuanto + 0.5);
    tl.to(".bars i", { height: function (i) { return [50, 80, 120, 160, 200][i]; }, duration: 0.5, stagger: 0.12, ease: "back.out(1.4)" }, tQuanto + 0.6);
    tl.to(".eye", { scale: 1.08, duration: 0.2, yoyo: true, repeat: 1 }, tMostrar);
    // 5. Dor, prova e convite entram na palavra.
    var tAgora = at("agora", 1, 11.4);
    out(".eye, .bars", tAgora);
    title(".t4", tAgora, at("curiosidade", 1, 16.0));
    CR.pop(tl, ".o1", at("dor", 1, 13.3));
    CR.pop(tl, ".o2", at("prova", 1, 14.0));
    CR.pop(tl, ".o3", at("convite", 1, 14.8));
    // 6. Curiosidade → atenção → clique.
    var tCur = at("curiosidade", 1, 16.0), tAten = at("atenção", 1, 16.8), tClique = at("clique", 1, 18.3);
    out(".orb", tCur);
    title(".t5", tCur, at("faça", 1, 19.0));
    CR.pop(tl, ".c1", tCur);
    CR.rise(tl, ".a1", tAten - 0.2);
    CR.pop(tl, ".c2", tAten);
    CR.rise(tl, ".a2", tClique - 0.3);
    CR.stamp(tl, ".c3", tClique, 0);
    // 7. Final com o mascote acenando.
    var tFaca = at("faça", 1, 19.0);
    out(".chain, .arrow", tFaca);
    title(".t6", tFaca);
    CR.profileCTA(tl, at("passo", 1, tFaca + 2.0), { x: 330, y: 1240, ink: "#FFFFFF", until: D });
    CR.rise(tl, ".mascot", 0.6);
    for (var w = 0; w < 4; w++) tl.to(".m-arm", { rotation: w % 2 ? 0 : -18, svgOrigin: "215 170", duration: 0.25 }, tFaca + w * 0.25);
    CR.sway(tl, ".m-body", D, 2.5, 1.4);
    for (var b = 1.5; b < D - 0.5; b += 2.8 + rnd()) { tl.to(".lid", { attr: { height: 56 }, duration: 0.06 }, b); tl.to(".lid", { attr: { height: 0 }, duration: 0.08 }, b + 0.08); }

    CR.camera(tl, ".cam", D, [tPor + 1.2, tFechar, tDedo, tMostrar, tClique], { inner: ".punch", drift: 0.03 });
    tl.set({}, {}, D);
    window.__timelines["film"] = tl;
  </script>
</div>
</body>
</html>
